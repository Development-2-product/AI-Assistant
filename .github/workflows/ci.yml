name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure non-secret debug endpoint
        run: |
          printf '%s\n' 'iamode.backendUrl=https://example.invalid/' 'iamode.devToken=' > frontend/local.properties
      - name: Unit tests
        run: ./frontend/gradlew testDebugUnitTest --no-configuration-cache
      - name: Build debug APK
        run: ./frontend/gradlew assembleDebug --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: ia-mode-debug-apk
          path: frontend/app/build/outputs/apk/debug/*.apk
