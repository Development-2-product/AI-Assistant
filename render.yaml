# Render Blueprint: New > Blueprint > pick this repo. Secrets are entered in the dashboard, never committed.
services:
  - type: web
    name: ia-mode-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /v1/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_MODE
        value: firebase
      # Keep public API docs disabled. Change temporarily in the Render
      # dashboard for a diagnostic session, then return it to false.
      - key: ENABLE_API_DOCS
        value: "false"
      - key: FIREBASE_PROJECT_ID
        value: ia-mode-509514
      # Leave false until Play Integrity App Check is registered and verified in
      # Firebase. Then set true together with the service-account JSON secret.
      - key: ENFORCE_APP_CHECK
        value: "false"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_WRITER
        value: gemini-3.5-flash
      - key: GEMINI_MODEL_FALLBACK
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      # Set this in Render to the documented proxy IP/CIDR(s) for your deployment.
      # Do not use '*', otherwise a public origin can trust forged X-Forwarded-For headers.
      - key: FORWARDED_ALLOW_IPS
        sync: false
